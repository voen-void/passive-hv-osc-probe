# Configuration for the HV probe modelling tools (extract_caps.py, probe_sim.py).
# All paths are relative to this file. Lengths in mm unless stated otherwise.

[files]
pcb         = "../hv-probe-passive/hv-probe-passive.kicad_pcb"
capacitance = "results/capacitance.json"   # written by extract_caps.py, read by probe_sim.py
results     = "results"

# ---------------------------------------------------------------------------
[geometry]
# Offset of the PCB mid-plane from the tube axis (+ = towards the F.Cu side).
# 0 means the board is centred in the tube.
board_offset_z = 0.0

# Height of the metal terminations of SMD parts above the copper, by footprint
# name substring. The terminations are modelled as conductive boxes over the
# pad area (the part body itself is treated as resin).
#   C_1808: FV42N470J302ECG, 2.0 mm max thickness
#   R_2512: HV121WF2004T4E, ~0.6 mm
[geometry.part_height]
"C_1808" = 2.0
"R_2512" = 0.6
"R_1206" = 0.55   # damping resistors
"C_1206" = 1.0
"R_0805" = 0.5
"D_SOD-323" = 1.0

# ---------------------------------------------------------------------------
[materials]
# Each dielectric is a causal wideband (Djordjevic-Sarkar) model fitted to one
# datasheet point: permittivity and loss tangent at spec_freq. Loss implies
# dispersion (eps' falls with frequency); er_hf sets the high-frequency limit,
# i.e. where the loss band ends. er_hf = 0 keeps the loss up to 10 GHz.
# loss_f_lo sets where the loss band starts (default 0.01 Hz). Below spec_freq
# eps' keeps rising down to it: for the resin 6.0 at 50 Hz, 6.7 at 10 Hz and
# 9.5 at DC. That part is an extrapolation of the single datasheet point.
# Changing these does not need a new field solve, except solve_freq.
resin_er        = 6.0     # Huntsman Arathane CW 5620 BLUE, datasheet at 50 Hz
resin_tan_d     = 0.11    # datasheet at 50 Hz ("11 %")
resin_spec_freq = 50.0
resin_er_hf     = 4.0     # only without resin_data: assumed high-frequency permittivity
# Measured resin: a cast sample between foil electrodes on the HM8118 bridge,
# corrected with a C0G reference (resin_fit.py; README, "Resin measurement").
# With resin_data set, the resin is a Cole-Cole model fitted to that sweep, and
# the datasheet point above only fixes what the sweep cannot:
#   - the scale: eps' = resin_er at resin_spec_freq, unless the sample's
#     geometry is given (resin_sample_area [mm2], resin_sample_thickness [mm]).
#     A thickness range [min, max] is an uneven sample: the datasheet point
#     keeps the scale and resin_fit.py only checks the geometry against it;
#   - resin_electrode_gap: air between foil and sample, a lossless capacitance
#     in series. "none" = full contact (tan d as measured: 0.078 at 50 Hz);
#     "datasheet" = the gap that brings tan d at resin_spec_freq to resin_tan_d
#     (177 pF here); a number = the gap capacitance in pF.
# Comment resin_data out to go back to the datasheet-only model.
resin_data          = "measurements/huntsman_cw5620_2026-11-17.csv"
resin_electrode_gap = "none"
# The sample of the 17 Nov sweep: a cast layer shaped like a half ellipse,
# 65 x 43 mm, foil electrodes 2 mm inside its edge (61 x 39 mm, pi/4 of that).
resin_sample_area      = 1870.0       # [mm2]
resin_sample_thickness = [1.0, 4.0]   # [mm] uneven; not measured point by point
fr4_er          = 4.5     # KiCad stackup
fr4_tan_d       = 0.02
fr4_spec_freq   = 1.0e6
fr4_er_hf       = 0.0
air_er          = 1.0
# The field solver uses each material's permittivity at this frequency; the
# circuit model scales every parasitic, per material, by eps(f)/eps(solve_freq).
# That scaling is a tangent: exact at solve_freq, and an overestimate that
# grows with the square of the distance in permittivity. 1 kHz puts the resin
# (5.2) midway between its values at 10 Hz (6.5) and 100 MHz (4.1), which
# leaves about a quarter of the error that solving at one end of the band has.
solve_freq      = 1.0e3
# Dielectric strength used for the stress report [kV/mm]. These are bulk
# short-term values; derate heavily for long-term DC/AC stress and for
# interfaces (surface tracking along the board/resin boundary).
resin_strength = 25.0
fr4_strength   = 20.0
air_strength   = 3.0

# ---------------------------------------------------------------------------
[mesh]
# Target grid steps [mm] in the fine region around the board and inside the
# tube. Use `--scale 1.5` on the command line for a quick coarse run, or
# `--scale 0.7` for a refinement/convergence check (needs ~3x the memory).
# These are 1.4x the steps used for the shorter rev-1 board: with the grid
# lines on the pad edges (snap_pads) the capacitances depend much less on the
# step, and the longer board would otherwise need 11 M nodes.
h_x        = 0.55   # along the probe axis
h_y        = 0.55   # across the board
h_z_board  = 0.2    # through the board, |z| < 1.2 mm
h_z_parts  = 0.4    # region occupied by components, |z| < 3.5 mm
h_tube     = 0.8    # elsewhere inside the tube
h_max      = 4.0    # far field
growth     = 1.25   # max ratio between neighbouring steps
margin     = 30.0   # free space around the tube/resin before the grounded box
# Grid lines on the pad edges of the divider nets, so pads and terminations
# keep their true size on any grid (see tools/README.md, "Accuracy").
snap_pads  = true

[solver]
# Relative CG residual. 1e-6 changes the capacitance matrix by < 0.01 fF
# against 1e-8 (checked on the --scale 2 grid) and saves ~30 % of the time.
tol = 1e-6
# Parallel processes for the field solves. Each holds its own copy of the
# system and AMG hierarchy, so set these from the free RAM (and cores).
# These are upper limits: the count is cut to what fits the memory that is
# free when the run starts (fieldsolver.fit_workers).
#   workers:      extract_caps.py, one conductor per task. About 1.4 GB per
#                 process on the default grid (4.7 M nodes), plus as much
#                 again while one of them sets up (one at a time), plus
#                 ~0.5 GB for the main process: 2 workers ~4.7 GB peak.
#   tube_workers: tube_sweep.py, one tube position per task, on its coarser
#                 grid (scale 1.3, 2.2 M nodes): 0.65 GB per process, twice
#                 that while it sets up, and they all set up at once.
workers      = 2
tube_workers = 4

# ---------------------------------------------------------------------------
[circuit]
# Net names as in the schematic; "IN" also matches KiCad's "/IN". The divider
# is followed from input_net through the resistor chain; it ends at the first
# node where the chain branches (the divider bottom, labelled BOT).
input_net    = "IN"               # HV tip
output_net   = "OUT"              # BNC centre pin
target_ratio = 1000.0
source_resistance = 0.0           # [ohm] DUT source impedance
# Damping: a resistor in series with the HV tip (not on the PCB, for design
# studies), and a resistor in series with every divider capacitor.
# segment_r = "pcb" uses the resistors on the board (R30..R49, each found as
# the resistor in series with a divider capacitor); a number replaces them.
tip_r     = 0.0
segment_r = "pcb"
# Series inductance of each divider segment. "auto" = the inductance of one
# pitch of the divider with its return on the tube wall, a coaxial estimate
# (mu0/2pi) * pitch * ln(r_tube / segment_radius): about 6 nH for the 10.9 mm
# pitch. segment_radius [mm] is the equivalent radius of what carries the
# current (part bodies and pours 1.5-3 mm wide: 0.6-1 mm). A number [H] sets
# every segment; "parts" uses only the capacitor ESL from [circuit.esl], which
# is the part's own 4.5 mm over a return a fraction of a millimetre away.
segment_l      = "auto"
segment_radius = 0.8
# Inductance in series with the HV tip. tip_l "auto" = partial inductance of
# the board's strip from the tip to the first divider parts (tip_strip_width
# [mm] wide); a number [H] replaces it. source_l [H] is added for whatever
# connects the probe to the circuit under test: ~1 nH per mm of lead and
# ground return, so a 10 cm ground lead is 100e-9 and will dominate.
tip_l           = "auto"
tip_strip_width = 2.5
source_l        = 0.0
pot_max   = 1.0e6                 # RV2 full-scale resistance
extra_esl = 1.0e-9                # ESL given to capacitance added by the optimiser
extra_esr = 0.05                  # ESR given to capacitance added by the optimiser

# Per-part overrides. Values use SI suffixes ("47p", "2M") or numbers.
#  - Trimmer (C13): a number/string sets its capacitance, "mid" = mid range.
#  - Potentiometer (RV2): resistance between its two nets, "auto" = set for
#    target_ratio with the scope input resistance included.
[circuit.parts]
C13 = "mid"
RV2 = "auto"

# Equivalent series inductance for capacitors, by footprint substring [H].
[circuit.esl]
"C_1808"  = 1.0e-9
"C_1206"  = 0.736e-9
"BFC2808" = 3.0e-9

# Equivalent series resistance for capacitors, by footprint substring [ohm].
# segment_r (above) is added on top of this for the divider capacitors.
[circuit.esr]
"C_1808"  = 0.05
"C_1206"  = 0.0635
"BFC2808" = 0.204

# Capacitance of other two-terminal parts (diodes, TVS ...) [F or SI string].
# Parts not listed here are left out of the model (probe_sim.py info warns).
[circuit.part_capacitance]
D1 = "20p"     # H36VND3B TVS junction capacitance (datasheet)

# ---------------------------------------------------------------------------
[cable]
type     = "RG58"
length   = 1.5     # [m]
# Back-termination resistance between the divider bottom and the BNC [ohm].
# "pcb" = use the resistor on the board (R29, detected automatically as the
# resistor between the divider bottom and output_net). A number replaces its
# value; on a board without such a resistor a number adds one.
series_r = "pcb"

# Characteristic impedance, velocity factor, DC loop resistance [ohm/m] and
# attenuation at 100 MHz [dB/m]. Conductor (skin effect) loss is assumed.
[cable.types.RG58]
z0 = 50.0
vf = 0.66
r_dc = 0.048
loss_100MHz = 0.16

[cable.types.RG174]
z0 = 50.0
vf = 0.66
r_dc = 0.40
loss_100MHz = 0.29

[cable.types.RG316]
z0 = 50.0
vf = 0.695
r_dc = 0.30
loss_100MHz = 0.26

# ---------------------------------------------------------------------------
[scope]
r_in = 1.0e6
c_in = 15e-12
bandwidth = 0.0    # [Hz] 0 = ideal; otherwise a 1st-order roll-off is applied

# ---------------------------------------------------------------------------
[stress]
voltage = 20000.0      # [V] applied to the HV tip for the E-field maps
hf_frequency = 1.0e6   # [Hz] frequency used for the "fast edge" voltage distribution

# ---------------------------------------------------------------------------
[optimize]
# Compensation is tuned so |H(f)/H(0) - 1| is minimal over this band.
f_lo = 10.0
f_hi = 1.0e6
# The peak error is often nearly flat over a range of bottom capacitances: its
# worst point is a dip from the resin dispersion that they cannot move. Within
# this fraction of the minimum peak, the capacitance with the smallest RMS
# error is used (see tools/README.md, "Objective"). 0 = strict minimax.
peak_tolerance = 0.01
# Largest divider capacitor that can be bought (3 kV C0G in 1808: 390 pF was
# not to be had and anything above 270 pF is hard to source, 25 Nov 2026).
# The grading and its rounding stay at or below it. "" = no limit.
cap_max = "270p"
# Values available for the fixed bottom capacitors (C0G), used to suggest
# a fixed part + trimmer combination.
series = "E12"
max_fixed_parts = 2

[sweep]
cable_lengths = [1.0, 2.0, 3.0]
series_r      = [0.0, 22.0, 47.0]
top_cap       = ["10p", "22p", "33p", "47p", "68p", "100p", "220p"]
# graded divider: bottom segment value, upper segments computed from the
# parasitic matrix so that the fast-edge voltage distribution is linear
graded_base   = ["22p", "33p", "47p"]
# damping study (probe_sim.py damping): resistor per divider capacitor x tip resistor [ohm]
seg_r         = [0.0, 10.0, 22.0, 33.0, 47.0, 68.0, 100.0]
tip_r         = [0.0, 47.0, 100.0]

# ---------------------------------------------------------------------------
[analysis]
source_rise = 1e-9     # [s] 10-90 % rise time of the test step used for rise time / overshoot

[ltspice]
exe = ""               # path to LTspice.exe; empty = search the usual install locations
